<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú | Café de especialidad y repostería - Café Aroma</title>

    <meta name="description"
        content="Sección del menú de Café Aroma, una cafetería dedicada al café de especialidad y la repostería artesanal.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://emmanuelvn1.github.io/cafe_aroma/pages/menu.html">

    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/interacciones.js" type="module"></script>
</head>

<body class="layout">

    <header class="encabezado layout__encabezado">

        <p class="marca">Café Aroma</p>
        <div class="encabezado__acciones">
            <button class="encabezado__boton encabezado__boton--menu" id="boton-menu" type="button"
                aria-controls="navegacion-principal" aria-expanded="false">
                <span aria-hidden="true">☰</span>
                <span>Menú</span>
            </button>

            <button class="encabezado__boton" id="boton-tema" type="button" hidden>
                Modo oscuro
            </button>
        </div>

        <nav class="encabezado__nav" id="navegacion-principal" aria-label="Navegación principal">
            <ul class="navegacion">

                <li>
                    <a href="../index.html">Inicio</a>
                </li>

                <li>
                    <a href="menu.html">Menú</a>
                </li>

                <li>
                    <a href="nosotros.html">Nosotros</a>
                </li>

                <li>
                    <a href="galeria.html">Galería</a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>

            </ul>
        </nav>

    </header>

    <aside class="layout__opciones opciones">

        <h2 class="opciones__titulo">Explora el menú</h2>

        <nav aria-label="Productos del menú">
            <ul class="opciones__lista">
                <li><a href="#espresso" class="opciones__enlace">Espresso</a></li>
                <li><a href="#latte" class="opciones__enlace">Latte</a></li>
                <li><a href="#croissant" class="opciones__enlace">Croissant</a></li>
                <li><a href="#pan-dulce" class="opciones__enlace">Pan dulce</a></li>
            </ul>
        </nav>

    </aside>


    <main class="layout__principal">

        <section class="pagina carta">

            <h1>Menú</h1>

            <p class="carta__intro">
                Elige tu café favorito y acompáñalo con algo de nuestra repostería.
            </p>

            <div class="buscador">
                <label class="buscador__etiqueta" for="buscar-producto">
                    Buscar productos por nombre
                </label>

                <input class="buscador__entrada" id="buscar-producto" type="search" placeholder="Ejemplo: latte o pan"
                    aria-controls="lista-productos">

                <p class="buscador__resultado" id="resultado-busqueda" role="status" aria-live="polite"></p>
            </div>

            <p id="estado-menu" role="status" aria-live="polite"></p>

            <button class="boton carta__reintentar" id="reintentar-menu" type="button" hidden>
                Volver a intentar
            </button>

            <ul class="carta__productos" id="lista-productos" aria-busy="false"></ul>

            <noscript>
                <p>Activa JavaScript para consultar el menú.</p>
            </noscript>

        </section>

    </main>


    <footer class="layout__pie">

        <p>Café Aroma &copy; 2026</p>

        <p>Versión del software <strong>1.0.0</strong></p>

    </footer>

</body>

</html>
