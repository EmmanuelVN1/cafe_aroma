             <div class="galeria">

            <figure class="galeria-item">
                <img
                    src="../assets/img/galeria.avif"
                    alt="Taza de café espresso"
                    loading="lazy"
                    decoding="async">
                <figcaption>Espresso</figcaption>
            </figure>


            <figure class="galeria-item">
                <img
                    src="../assets/img/galeria1.avif"
                    alt="Cappuccino con espuma de leche"
                    loading="lazy"
                    decoding="async">
                <figcaption>Cappuccino</figcaption>
            </figure>


            <figure class="galeria-item">
                <img
                    src="../assets/img/latte.avif"
                    alt="Café latte"
                    loading="lazy"
                    decoding="async">
                <figcaption>Latte</figcaption>
            </figure>


            <figure class="galeria-item">
                <img
                    src="../assets/img/croissant.avif"
                    alt="Croissant artesanal recién horneado"
                    loading="lazy"
                    decoding="async">
                <figcaption>Croissant artesanal</figcaption>
            </figure>


            <figure class="galeria-item">
                <img
                    src="../assets/img/panes.avif"
                    alt="Postre artesanal de Café Aroma"
                    loading="lazy"
                    decoding="async">
                <figcaption>Repostería artesanal</figcaption>
            </figure>

            <figure class="galeria-item">
    <img
        src="../assets/img/cafeteriainterior.webp"
        alt="Cheesecake artesanal de Café Aroma"
