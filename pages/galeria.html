<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería | Cafés, repostería y ambiente de Café Aroma</title>

    <meta name="description"
        content="Explora la galería de Café Aroma: espresso, cappuccino, latte, croissants, repostería artesanal y el interior de nuestra cafetería.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://emmanuelvn1.github.io/cafe_aroma/pages/galeria.html">

    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/interacciones.js" type="module"></script>
    <script src="../js/galeria.js" type="module"></script>
</head>

<body>

    <header class="encabezado">

        <p class="marca">Café Aroma</p>
        <div class="encabezado__acciones">
            <button class="encabezado__boton encabezado__boton--menu" id="boton-menu" type="button"
                aria-controls="navegacion-principal" aria-expanded="false">
                <span aria-hidden="true">☰</span>
                <span>Menú</span>
            </button>

            <button class="encabezado__boton" id="boton-tema" type="button" hidden>
                Modo oscuro
            </button>
        </div>

        <nav class="encabezado__nav" id="navegacion-principal" aria-label="Navegación principal">
            <ul class="navegacion">

                <li><a href="../index.html">Inicio</a></li>

                <li><a href="menu.html">Menú</a></li>

                <li><a href="nosotros.html">Nosotros</a></li>

                <li><a href="galeria.html">Galería</a></li>

                <li><a href="contacto.html">Contacto</a></li>

            </ul>
        </nav>

    </header>


    <main>

        <section class="pagina">

            <h1>Galería</h1>

            <p id="estado-galeria" class="galeria__descripcion" role="status"></p>
            <div class="galeria" id="lista-fotos"></div>

            <section class="pagina--informativa" aria-labelledby="titulo-alta-foto">
                <button id="reintentar-galeria" class="boton carta__reintentar" type="button" hidden>
                    Volver a cargar la galería
                </button>

                <h2 id="titulo-alta-foto">Agregar una foto a la galería</h2>
                <p>Elige una imagen del café, ponle un título y describe lo que se ve.</p>

                <form id="formulario-foto" class="formulario">
                    <div class="formulario__campo">
                        <label for="foto-titulo">Título</label>
                        <input id="foto-titulo" class="formulario__control" name="titulo" type="text" required
                            minlength="2" maxlength="60">
                    </div>

                    <div class="formulario__campo">
                        <label for="foto-categoria">Categoría</label>
                        <select id="foto-categoria" class="formulario__control" name="categoria" required>
                            <option value="">Elige una categoría</option>
                            <option>Bebidas</option>
                            <option>Repostería</option>
                            <option>Ambiente</option>
                        </select>
                    </div>

                    <div class="formulario__campo">
                        <label for="foto-imagen">Imagen del café</label>
                        <select id="foto-imagen" class="formulario__control" name="imagen" required>
                            <option value="">Elige una imagen</option>
                            <option value="ambienteacogedor.jpg">Ambiente del café</option>
                            <option value="reposteriafresca.avif">Repostería fresca</option>
                            <option value="tazadecafe.png">Taza de café</option>
                        </select>
                    </div>

                    <div class="formulario__campo">
                        <label for="foto-descripcion">Descripción de la imagen</label>
                        <textarea id="foto-descripcion" class="formulario__control" name="descripcion" rows="3" required
                            minlength="5" maxlength="160"></textarea>
                    </div>

                    <button id="guardar-foto" class="boton formulario__boton" type="submit" disabled>
                        Agregar a la galería
                    </button>

                    <p id="resultado-foto" class="formulario__resultado" role="status"></p>
                </form>

                <noscript>Activa JavaScript para consultar la galería o agregar una foto.</noscript>
            </section>

        </section>

    </main>



    <footer>

        <p>Café Aroma &copy; 2026</p>

        <p>Versión del software <strong>1.0.0</strong></p>

    </footer>

</body>

</html>
