<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Café Aroma</title>

    <meta name="description"
        content="Sección de contacto de Café Aroma. Accede a las páginas de inicio, menú, galería y presentación de nuestra cafetería.">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://emmanuelvn1.github.io/cafe_aroma/pages/contacto.html">

    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/interacciones.js" type="module"></script>
</head>

<body>

    <header class="encabezado">

        <p class="marca">Café Aroma</p>
        <div class="encabezado__acciones">
            <button class="encabezado__boton encabezado__boton--menu" id="boton-menu" type="button"
                aria-controls="navegacion-principal" aria-expanded="false">
                <span aria-hidden="true">☰</span>
                <span>Menú</span>
            </button>

            <button class="encabezado__boton" id="boton-tema" type="button" hidden>
                Modo oscuro
            </button>
        </div>

        <nav class="encabezado__nav" id="navegacion-principal" aria-label="Navegación principal">
            <ul class="navegacion">

                <li><a href="../index.html">Inicio</a></li>

                <li><a href="menu.html">Menú</a></li>

                <li><a href="nosotros.html">Nosotros</a></li>

                <li><a href="galeria.html">Galería</a></li>

                <li><a href="contacto.html">Contacto</a></li>

            </ul>
        </nav>

    </header>


    <main>

        <section class="pagina pagina--informativa">

            <h1>Contacto</h1>

            <p>Escríbenos tus dudas sobre Café Aroma. Todos los campos son obligatorios.</p>
            <p>Formulario de práctica: no envía mensajes.</p>

            <form class="formulario" id="formulario-contacto" novalidate>
                <div class="formulario__campo">
                    <label for="nombre">Nombre</label>
                    <input class="formulario__control" id="nombre" name="nombre" type="text" autocomplete="name"
                        required minlength="2" maxlength="60" aria-describedby="error-nombre">
                    <span class="formulario__error" id="error-nombre"></span>
                </div>

                <div class="formulario__campo">
                    <label for="correo">Correo electrónico</label>
                    <input class="formulario__control" id="correo" name="correo" type="email" autocomplete="email"
                        required aria-describedby="error-correo">
                    <span class="formulario__error" id="error-correo"></span>
                </div>

                <div class="formulario__campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea class="formulario__control" id="mensaje" name="mensaje" rows="5" required minlength="10"
                        maxlength="500" aria-describedby="error-mensaje"></textarea>
                    <span class="formulario__error" id="error-mensaje"></span>
                </div>

                <button class="boton formulario__boton" type="submit">
                    Validar mensaje
                </button>

                <p class="formulario__resultado" id="resultado-formulario" role="status" aria-live="polite"></p>
            </form>

        </section>

    </main>


    <footer>

        <p>Café Aroma &copy; 2026</p>

        <p>Versión del software <strong>1.0.0</strong></p>

    </footer>

</body>

</html>
